[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "objection-winmap"
version = "0.1.0"
description = "Evidence-backed objection coaching for field sales teams"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<2.1",
  "jinja2>=3.1,<4", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1.2,<2"]
browser = ["playwright>=1.51,<2"]

[tool.hatch.build.targets.sdist]
include = ["src", "seed", "scripts", "tests", "tokens.css", "README.md", "pyproject.toml", "uv.lock", "Dockerfile", ".env.example", "PLAN.md", "RESEARCH.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/objection_winmap"]

[tool.hatch.build.targets.wheel.force-include]
"seed" = "objection_winmap/fixtures"
"tokens.css" = "objection_winmap/static/tokens.css"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
